docRoot                   /home/caselawindia.io/public_html
vhDomain                  caselawindia.io
vhAliases                 www.caselawindia.io
adminEmails               admin@caselawindia.io
enableGzip                1

rewrite {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{HTTPS} !=on
RewriteRule ^ https://caselawindia.io%{REQUEST_URI} [R=301,L]
END_rules
}

errorlog /home/caselawindia.io/logs/caselawindia.io.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /home/caselawindia.io/logs/caselawindia.io.access_log {
  useServer               0
  rollingSize             10M
  keepDays                10
}

extprocessor caselawindia-node {
  type                    proxy
  address                 127.0.0.1:8787
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 caselawindia-node
  addDefaultCharset       off
}

context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1
  addDefaultCharset       off
}

vhssl {
  keyFile                 /etc/letsencrypt/live/caselawindia.io/privkey.pem
  certFile                /etc/letsencrypt/live/caselawindia.io/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling          1
}
